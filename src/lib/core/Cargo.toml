[package]
name = "icp-bundle-deployer-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The project model and deployment core icp-cli itself uses. Everything it
# abstracts behind a trait — the filesystem, canister calls, sync-plugin
# execution — is supplied by the host. Its `host` feature is the implementations
# of those seams for a machine with a filesystem and subprocesses, which a
# browser has none of; leaving it off is also what upstream's CI checks builds
# for `wasm32-unknown-unknown`.
icp-project = { git = "https://github.com/dfinity/icp-cli", rev = "0964d4a6d52c85b46ba3c6da952d3dab0a004391", default-features = false }
# The progress-reporting handles `icp-project`'s seams take; a plugin runner is
# handed one, so the type has to be nameable here.
icp-events = { git = "https://github.com/dfinity/icp-cli", rev = "0964d4a6d52c85b46ba3c6da952d3dab0a004391" }

async-trait = "0.1.88"
camino = "1.1.9"
candid = "0.10.19"
console_error_panic_hook = "0.1.7"
flate2 = { version = "1.1.8", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
ic-management-canister-types = "0.9.0"
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
sha2 = "0.11.0"
snafu = "0.9.0"
tar = { version = "0.4.46", default-features = false }
url = "2.5.4"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
wasmparser = { version = "0.258.0", default-features = false, features = ["component-model"] }

[dev-dependencies]
# Loading a bundle is only nominally async — nothing it reads can block — so a
# bare executor is all the tests need to drive it.
futures = "0.3.31"
indoc = "2.0.6"
wasm-encoder = "0.258"
