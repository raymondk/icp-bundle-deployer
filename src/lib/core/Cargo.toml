[package]
name = "icp-bundle-deployer-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The deployment core icp-cli itself uses. Everything it abstracts behind a trait
# — the filesystem, the ICP API, sync-plugin execution — is supplied by the host.
icp-deploy-canister = { git = "https://github.com/dfinity/icp-cli", rev = "d9619c7b2f9d98830817d7003f3a80296ab7469d" }

async-trait = "0.1.88"
camino = "1.1.9"
candid = "0.10.19"
console_error_panic_hook = "0.1.7"
flate2 = { version = "1.1.8", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
ic-management-canister-types = "0.8.0"
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
sha2 = "0.11.0"
snafu = "0.9.0"
tar = { version = "0.4.46", default-features = false }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"

[dev-dependencies]
# Loading a bundle is only nominally async — nothing it reads can block — so a
# bare executor is all the tests need to drive it.
futures = "0.3.31"
indoc = "2.0.6"
