# The Motoko toolchain and the registry canister it builds. `mops build` is
# what the `@dfinity/motoko` recipe in icp.yaml runs; `mops test` runs the
# canister's unit tests in test/*.test.mo.

[toolchain]
moc = "1.12.0"

[dependencies]
core = "2.6.2"

[dev-dependencies]
test = "2.1.2"

[moc]
args = ["--default-persistent-actors", "-W", "M0236,M0237,M0223"]

[canisters.registry]
main = "src/registry/main.mo"
