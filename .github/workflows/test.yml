# Builds the project and runs every suite the README describes under "Tests":
# on each pull request, and on main as the first job of the Deploy workflow,
# which calls this one.
name: Test

on:
  pull_request:
  workflow_call:

# A newer push to a pull request supersedes the run in progress. Called from
# Deploy, runs queue instead, since one may be the gate of a deployment.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain

      # What `icp deploy` builds for the frontend canister.
      - name: Build the page
        run: npm run build

      # The Rust core's tests, the registry's Motoko tests, and the offline
      # TypeScript suite.
      - name: Offline suites
        run: npm test

      # The published wasms the e2e fixture bundle is built from, kept between
      # runs as they are between local runs.
      - name: Restore the e2e fixtures' release artifacts
        uses: actions/cache@v6
        with:
          path: .cache
          key: e2e-fixtures-${{ hashFiles('test/support/fixtures.ts') }}

      - name: Start a local network
        run: icp network start -d

      - name: End-to-end suite
        run: npm run test:e2e

      - name: Stop the local network
        if: always()
        run: icp network stop
